name: Actualizar calendarios (Real Madrid y Sixers)

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC todos los días
  workflow_dispatch: {}  # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python generar_ics.py
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - run: python generar_ics_sixers.py  # API pública de ESPN, sin token

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add partidos-real-madrid.ics partidos-sixers.ics
          git diff --staged --quiet || git commit -m "Actualiza calendario de partidos"
          git push
